<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reference Door-Width POC</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      color: #f4f1ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    #tabBar {
      display: flex;
      flex: 0 0 40px;
      height: 40px;
      pointer-events: auto;
      background: rgba(8, 10, 12, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    #tabBar a {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #efe6d4;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    #tabBar a[aria-current="page"] {
      color: #f4f1ea;
      background: rgba(255, 210, 122, 0.16);
      box-shadow: inset 0 -3px 0 #ffd27a;
    }

    #modeToggle,
    #referenceToggle {
      display: flex;
      flex: 0 0 auto;
      gap: 3px;
      margin: 0.28rem 0.5rem 0;
      padding: 3px;
      background: rgba(8, 10, 12, 0.62);
      border-radius: 999px;
    }

    #modeToggle button,
    #referenceToggle button {
      flex: 1 1 0;
      min-width: 0;
      min-height: 40px;
      padding: 0 0.45rem;
      background: transparent;
      color: #efe6d4;
      font-size: 0.78rem;
      line-height: 1.15;
    }

    #modeToggle button[aria-pressed="true"],
    #referenceToggle button[aria-pressed="true"] {
      background: #f4f1ea;
      color: #1a1714;
    }

    #statusStrip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem 0.55rem;
      margin: 0.28rem 0.5rem 0;
      padding: 0.28rem 0.55rem;
      background: rgba(8, 10, 12, 0.72);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    #visionStatus,
    #cameraResolution,
    #tiltReadout,
    #instructionText,
    #measurementSummary,
    #diagnosticsSummary,
    #resultCentimeters,
    #resultMeta {
      margin: 0;
    }

    #tiltReadout {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    #tiltLabel {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #c8c0b4;
    }

    #enableTiltButton {
      min-height: 32px;
      padding: 0 0.65rem;
      font-size: 0.75rem;
    }

    #instructionText {
      margin: 0.28rem 0.5rem 0;
      padding: 0.32rem 0.55rem;
      background: rgba(8, 10, 12, 0.62);
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    #instructionText.is-expanded {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }

    #instructionText.is-flashing {
      animation: instruction-flash 0.35s ease-in-out 3;
    }

    @keyframes instruction-flash {
      50% { background: #8a4b00; }
    }

    #stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 55vh;
      margin: 0.28rem 0.5rem 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    #preview,
    #still,
    #marks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #preview,
    #still {
      object-fit: contain;
      background: #000;
    }

    #still {
      display: none;
    }

    #stage.is-still #preview {
      display: none;
    }

    #stage.is-still #still {
      display: block;
    }

    #marks {
      pointer-events: none;
    }

    #readout {
      flex: 0 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0.3rem 0.5rem 0;
      background: #0c0e10;
    }

    #resultPrimary,
    #controls {
      flex: 0 0 auto;
    }

    /* Details and credits shrink first so the stage and the buttons stay up. */
    #belowFold {
      flex: 0 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    #resultPrimary {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.1rem 0.45rem;
    }

    #resultInches {
      display: block;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }

    #resultInches:empty,
    #resultCentimeters:empty,
    #resultMeta:empty {
      display: none;
    }

    #resultCentimeters {
      display: block;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
    }

    #resultMeta {
      display: block;
      font-size: 0.78rem;
      color: #efe6d4;
      font-variant-numeric: tabular-nums;
    }

    #controls {
      display: flex;
      flex-wrap: nowrap;
      gap: 0.3rem;
      margin-top: 0.3rem;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: #f4f1ea;
      color: #1a1714;
      font: 600 0.82rem/1.1 inherit;
      padding: 0 0.4rem;
      min-height: 44px;
    }

    #controls button {
      display: flex;
      flex: 1 1 0;
      flex-wrap: wrap;
      align-items: center;
      align-content: center;
      justify-content: center;
      min-width: 0;
      text-align: center;
    }

    /* A <br> is its own flex item. Full-width and zero height stacks the two
       label lines without inserting a blank line between them. */
    #controls button br {
      flex-basis: 100%;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.45;
    }

    #measurementList,
    #diagnosticsList {
      margin-top: 0.35rem;
      background: rgba(8, 10, 12, 0.55);
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.35;
      user-select: text;
    }

    #measurementSummary,
    #diagnosticsSummary {
      padding: 0.5rem 0.65rem;
      font-weight: 600;
      cursor: pointer;
    }

    #measurementRows {
      max-height: 26vh;
      overflow: auto;
    }

    .measurement-row,
    .measurement-empty {
      margin: 0;
      padding: 0.4rem 0.65rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    #credits {
      padding: 0.35rem 0.15rem 0.45rem;
      background: transparent;
      color: #e6e0d6;
      font-size: max(11px, 0.72rem);
      line-height: 1.35;
      user-select: text;
    }

    /* Landscape: stage fills the left; chrome stacks in a 200px column.
       The video stays object-fit: contain; fitMapping() is reapplied on rotate. */
    @media (orientation: landscape) {
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 200px;
        grid-template-rows: auto auto auto auto auto minmax(0, 1fr);
        height: 100%;
      }

      #tabBar {
        grid-column: 2;
        grid-row: 1;
        height: auto;
        min-height: 36px;
        flex: none;
      }

      #modeToggle {
        grid-column: 2;
        grid-row: 2;
      }

      #referenceToggle {
        grid-column: 2;
        grid-row: 3;
      }

      #statusStrip {
        grid-column: 2;
        grid-row: 4;
      }

      #instructionText {
        grid-column: 2;
        grid-row: 5;
      }

      #readout {
        grid-column: 2;
        grid-row: 6;
        display: block;
        overflow: auto;
        margin: 0;
      }

      #stage {
        grid-column: 1;
        grid-row: 1 / -1;
        margin: 0;
        min-height: 0;
        height: auto;
      }

      .clipboard-fallback {
        grid-column: 1;
        grid-row: 1;
      }

      #modeToggle,
      #referenceToggle,
      #statusStrip,
      #instructionText {
        margin-left: 0.3rem;
        margin-right: 0.3rem;
      }

      #modeToggle button,
      #referenceToggle button {
        min-height: 36px;
        font-size: 0.68rem;
        padding: 0 0.25rem;
      }

      #readout {
        padding: 0.3rem 0.35rem 0.2rem;
      }

      #controls {
        flex-direction: column;
      }

      #controls button {
        flex: 0 0 auto;
        min-height: 36px;
        white-space: nowrap;
      }

      #resultInches {
        font-size: 1.2rem;
      }

      #credits {
        padding-bottom: 0.4rem;
      }
    }

    /* The phone has no console we can read. Closed until the tester opens it. */
    #diagnosticsPanel {
      max-height: 30vh;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0;
      padding: 0.4rem 0.65rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: #d7d2c8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      line-height: 1.35;
      user-select: text;
      overflow-wrap: anywhere;
    }

    .diagnostic-row {
      margin: 0;
    }

    .clipboard-fallback {
      position: fixed;
      left: 0;
      top: 0;
      width: 2em;
      height: 2em;
      margin: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      font-size: 16px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4/dist/opencv.min.js" async></script>
  <script src="reference.js" defer></script>
</head>
<body>
  <nav id="tabBar">
    <a href="index.html">SLAM</a>
    <a href="reference.html" aria-current="page">Reference</a>
  </nav>

  <div id="modeToggle" role="group" aria-label="Measurement mode">
    <button type="button" id="floorModeButton" aria-pressed="true">Floor (door width)</button>
    <button type="button" id="wallModeButton" aria-pressed="false">Wall (height)</button>
  </div>

  <div id="referenceToggle" role="group" aria-label="Scale reference">
    <button type="button" id="cardReferenceButton" aria-pressed="true">Credit card</button>
    <button type="button" id="letterReferenceButton" aria-pressed="false">Letter sheet</button>
  </div>

  <div id="statusStrip">
    <p id="visionStatus">Loading vision library…</p>
    <p id="cameraResolution">Camera: —</p>
    <p id="tiltReadout">
      <span id="tiltLabel">tilt</span>
      <span id="tiltAngles">β — · γ —</span>
    </p>
    <button type="button" id="enableTiltButton" hidden>Enable tilt</button>
  </div>

  <p id="instructionText" role="button" tabindex="0" aria-expanded="false">Lay the card (or sheet) on the floor between the jambs. Step back so both jambs and the card are in view, then Capture.</p>

  <div id="stage">
    <video id="preview" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="still"></canvas>
    <canvas id="marks"></canvas>
  </div>

  <div id="readout">
    <div id="resultPrimary">
      <span id="resultInches"></span>
      <span id="resultCentimeters"></span>
      <span id="resultMeta"></span>
    </div>
    <div id="controls">
      <button type="button" id="captureButton" disabled>Capture</button>
      <button type="button" id="resetPointsButton">Reset<br>points</button>
      <button type="button" id="logButton">Save<br>to list</button>
      <button type="button" id="copyResultsButton">Copy<br>results</button>
    </div>
    <div id="belowFold">
      <details id="measurementList">
        <summary id="measurementSummary">Session list (0)</summary>
        <div id="measurementRows"></div>
      </details>
      <details id="diagnosticsList">
        <summary id="diagnosticsSummary">Debug log (0)</summary>
        <div id="diagnosticsPanel"></div>
      </details>
      <footer id="credits">Uses OpenCV.js (Apache-2.0). No 8th Wall engine is loaded on this page.</footer>
    </div>
  </div>
  <textarea id="clipboardFallback" class="clipboard-fallback" readonly aria-hidden="true" tabindex="-1"></textarea>
</body>
</html>
