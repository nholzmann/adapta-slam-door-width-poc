<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Reference Door-Width POC</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      color: #f4f1ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* The photo fills the viewport. Chrome floats above it; fitMapping()
       still uses the stage box, which is the viewport. */
    #stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
      transform: translateZ(0);
    }

    #preview,
    #still,
    #marks {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #preview,
    #still {
      object-fit: contain;
      background: #000;
    }

    #still {
      display: none;
    }

    #stage.is-still #preview {
      display: none;
    }

    #stage.is-still #still {
      display: block;
    }

    #marks {
      z-index: 1;
      pointer-events: none;
    }

    #topBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 4;
      box-sizing: border-box;
      height: calc(44px + env(safe-area-inset-top, 0px));
      max-height: calc(44px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 6px 0;
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      overflow-y: hidden;
      background: rgba(8, 10, 12, 0.62);
      pointer-events: auto;
    }

    #tabBar {
      display: flex;
      flex: 0 0 auto;
      gap: 4px;
      background: transparent;
    }

    #tabBar a {
      display: flex;
      align-items: center;
      height: 26px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: #efe6d4;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.68rem;
      white-space: nowrap;
    }

    #tabBar a[aria-current="page"] {
      color: #1a1714;
      background: #ffd27a;
    }

    #modeToggle,
    #referenceToggle {
      display: flex;
      flex: 0 0 auto;
      gap: 2px;
      margin: 0;
      padding: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
    }

    #modeToggle button,
    #referenceToggle button,
    #statusToggle {
      min-height: 26px;
      height: 26px;
      padding: 0 8px;
      border-radius: 999px;
      background: transparent;
      color: #efe6d4;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    #modeToggle button[aria-pressed="true"],
    #referenceToggle button[aria-pressed="true"] {
      background: #f4f1ea;
      color: #1a1714;
    }

    #statusToggle {
      flex: 0 0 auto;
      width: 26px;
      padding: 0;
    }

    #statusToggle[aria-expanded="true"] {
      background: #f4f1ea;
      color: #1a1714;
    }

    #statusStrip {
      position: fixed;
      top: calc(44px + env(safe-area-inset-top, 0px));
      left: 8px;
      right: 8px;
      z-index: 4;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.2rem 0.5rem;
      margin: 0;
      padding: 0.28rem 0.55rem;
      background: rgba(8, 10, 12, 0.82);
      border-radius: 8px;
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      pointer-events: auto;
    }

    #visionStatus,
    #cameraResolution,
    #tiltReadout,
    #instructionText,
    #measurementSummary,
    #diagnosticsSummary,
    #resultCentimeters,
    #resultMeta {
      margin: 0;
    }

    #tiltReadout {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    #tiltLabel {
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #c8c0b4;
    }

    #enableTiltButton {
      min-height: 28px;
      height: 28px;
      padding: 0 0.6rem;
      font-size: 0.72rem;
    }

    #instructionText {
      position: fixed;
      top: calc(48px + env(safe-area-inset-top, 0px));
      left: 8px;
      right: 8px;
      z-index: 3;
      margin: 0;
      padding: 0.28rem 0.55rem;
      background: rgba(8, 10, 12, 0.62);
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      pointer-events: auto;
    }

    #instructionText.is-expanded {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      background: rgba(8, 10, 12, 0.88);
    }

    #instructionText.is-flashing {
      animation: instruction-flash 0.35s ease-in-out 3;
    }

    #instructionText.is-flashing-ok {
      animation: instruction-flash-ok 0.35s ease-in-out 3;
    }

    @keyframes instruction-flash {
      50% { background: #8a4b00; }
    }

    @keyframes instruction-flash-ok {
      50% { background: #1f6b3a; }
    }

    /* While a finger is down the sheet and the instruction would cover
       the loupe and the image edge the tester is trying to hit. */
    body.is-dragging #instructionText,
    body.is-dragging #readout {
      visibility: hidden;
    }

    #readout {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      box-sizing: border-box;
      max-height: calc(96px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(8, 10, 12, 0.72);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      overflow: hidden;
      pointer-events: auto;
    }

    #readout.is-expanded {
      max-height: 60vh;
    }

    #sheetHandle {
      flex: 0 0 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 18px;
      min-height: 18px;
      margin: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: #f4f1ea;
      font-size: 0.7rem;
      line-height: 1;
    }

    #sheetHandle::before {
      content: "";
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: rgba(244, 241, 234, 0.55);
    }

    #sheetRow {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 0;
      padding: 0 6px 6px;
    }

    #resultPrimary {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 0.3rem;
    }

    #resultInches {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }

    #resultInches:empty,
    #resultCentimeters:empty,
    #resultMeta:empty {
      display: none;
    }

    #resultCentimeters {
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }

    #resultMeta {
      flex-basis: 100%;
      font-size: 0.62rem;
      line-height: 1.15;
      color: #efe6d4;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #controls {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: nowrap;
      gap: 0.25rem;
      margin: 0;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: #f4f1ea;
      color: #1a1714;
      font: 600 0.82rem/1.1 inherit;
      padding: 0 0.4rem;
      min-height: 44px;
    }

    #controls button {
      display: flex;
      flex: 0 1 auto;
      flex-wrap: wrap;
      align-items: center;
      align-content: center;
      justify-content: center;
      min-width: 52px;
      min-height: 40px;
      max-width: 76px;
      padding: 0 0.3rem;
      font-size: 0.66rem;
      line-height: 1.05;
      text-align: center;
    }

    /* A <br> is its own flex item. Full-width and zero height stacks the two
       label lines without inserting a blank line between them. */
    #controls button br {
      flex-basis: 100%;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.45;
    }

    #belowFold {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 0.45rem 0.35rem;
    }

    #measurementList,
    #diagnosticsList {
      margin-top: 0.3rem;
      background: rgba(8, 10, 12, 0.55);
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.35;
      user-select: text;
    }

    #measurementSummary,
    #diagnosticsSummary {
      padding: 0.45rem 0.6rem;
      font-weight: 600;
      cursor: pointer;
    }

    .measurement-row,
    .measurement-empty {
      margin: 0;
      padding: 0.4rem 0.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    #credits {
      padding: 0.35rem 0.15rem 0.2rem;
      background: transparent;
      color: #e6e0d6;
      font-size: max(11px, 0.72rem);
      line-height: 1.35;
      user-select: text;
    }

    #diagnosticsPanel {
      margin: 0;
      padding: 0.4rem 0.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: #d7d2c8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.72rem;
      line-height: 1.35;
      user-select: text;
      overflow-wrap: anywhere;
    }

    .diagnostic-row {
      margin: 0;
    }

    .clipboard-fallback {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 5;
      width: 2em;
      height: 2em;
      margin: 0;
      padding: 0;
      border: 0;
      opacity: 0;
      font-size: 16px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4/dist/opencv.min.js" async></script>
  <script src="reference.js" defer></script>
</head>
<body>
  <header id="topBar">
    <nav id="tabBar">
      <a href="index.html">SLAM</a>
      <a href="reference.html" aria-current="page">Reference</a>
    </nav>
    <div id="modeToggle" role="group" aria-label="Measurement mode">
      <button type="button" id="floorModeButton" aria-pressed="true" title="Floor (door width)">Floor</button>
      <button type="button" id="wallModeButton" aria-pressed="false" title="Wall (height)">Wall</button>
    </div>
    <div id="referenceToggle" role="group" aria-label="Scale reference">
      <button type="button" id="cardReferenceButton" aria-pressed="true" title="Credit card">Card</button>
      <button type="button" id="letterReferenceButton" aria-pressed="false" title="Letter sheet">Sheet</button>
    </div>
    <button type="button" id="statusToggle" aria-expanded="false" aria-controls="statusStrip" aria-label="Show status">ⓘ</button>
  </header>

  <div id="statusStrip" hidden>
    <p id="visionStatus">Loading vision library…</p>
    <p id="cameraResolution">Camera: —</p>
    <p id="tiltReadout">
      <span id="tiltLabel">tilt</span>
      <span id="tiltAngles">β — · γ —</span>
    </p>
    <button type="button" id="enableTiltButton" hidden>Enable tilt</button>
  </div>

  <p id="instructionText" role="button" tabindex="0" aria-expanded="false">Lay the card (or sheet) on the floor between the jambs. Step back so both jambs and the card are in view, then Capture.</p>

  <div id="stage">
    <video id="preview" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="still"></canvas>
    <canvas id="marks"></canvas>
  </div>

  <div id="readout">
    <button type="button" id="sheetHandle" aria-expanded="false" aria-controls="belowFold" aria-label="Expand details"><span id="sheetChevron" aria-hidden="true">▴</span></button>
    <div id="sheetRow">
      <div id="resultPrimary">
        <span id="resultInches"></span>
        <span id="resultCentimeters"></span>
        <span id="resultMeta"></span>
      </div>
      <div id="controls">
        <button type="button" id="captureButton" disabled>Capture</button>
        <button type="button" id="resetPointsButton">Reset<br>points</button>
        <button type="button" id="logButton">Save<br>to list</button>
        <button type="button" id="copyResultsButton">Copy<br>results</button>
      </div>
    </div>
    <div id="belowFold" hidden>
      <details id="measurementList">
        <summary id="measurementSummary">Session list (0)</summary>
        <div id="measurementRows"></div>
      </details>
      <details id="diagnosticsList">
        <summary id="diagnosticsSummary">Debug log (0)</summary>
        <div id="diagnosticsPanel"></div>
      </details>
      <footer id="credits">Uses OpenCV.js (Apache-2.0). No 8th Wall engine is loaded on this page.</footer>
    </div>
  </div>
  <textarea id="clipboardFallback" class="clipboard-fallback" readonly aria-hidden="true" tabindex="-1"></textarea>
</body>
</html>
